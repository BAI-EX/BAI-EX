services:
  - type: web
    name: baiex
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: baiex-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: baiex-db
    databaseName: baiex
    plan: free
